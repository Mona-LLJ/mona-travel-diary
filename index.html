// ==================== CHECKLIST ====================
function renderChecklist(){
  var container=document.getElementById('tab-checklist');
  if(currentView.checklistDetail){renderChecklistDetail(currentView.checklistDetail);return}
  var html='<div class="checklist-grid">';
  for(var key in DEFAULT_CHECKLISTS){
    var info=DEFAULT_CHECKLISTS[key];
    var cats=state.checklists[key]||{};
    var total=0,checked=0;
    for(var cn in cats){cats[cn].forEach(function(i){total++;if(i.checked)checked++})}
    var pct=total>0?Math.round(checked/total*100):0;
    html+='<div class="scenario-card" onclick="viewChecklist(\''+key+'\')"><div class="scenario-icon">'+info.icon+'</div><div class="scenario-name">'+info.name+'</div><div class="scenario-progress">'+checked+'/'+total+'</div><div class="scenario-bar"><div class="scenario-bar-fill" style="width:'+pct+'%"></div></div></div>';
  }
  html+='</div>';
  container.innerHTML=html;
}

function viewChecklist(key){currentView.checklistDetail=key;switchTab('checklist')}
function backToChecklist(){currentView.checklistDetail=null;switchTab('checklist')}

function renderChecklistDetail(key){
  var info=DEFAULT_CHECKLISTS[key];
  var cats=state.checklists[key]||{};
  var total=0,checked=0;
  for(var cn in cats){cats[cn].forEach(function(i){total++;if(i.checked)checked++})}
  var container=document.getElementById('tab-checklist');
  var html='<div class="checklist-header"><button class="checklist-back" onclick="backToChecklist()">←</button><div class="checklist-title">'+info.icon+' '+info.name+'</div></div>';
  html+='<div style="font-size:13px;color:var(--text-muted);margin-bottom:14px">已完成 '+checked+'/'+total+' 件 · '+(total>0?Math.round(checked/total*100):0)+'%</div>';
  info.categories.forEach(function(cat,idx){
    var items=cats[cat.name]||[];
    var catChecked=items.filter(function(i){return i.checked}).length;
    var catPct=items.length>0?Math.round(catChecked/items.length*100):0;
    html+='<div class="cl-category">';
    html+='<div class="cl-category-header"><div class="cl-category-title"><span class="cl-category-icon">'+cat.icon+'</span>'+cat.name+'</div><span class="cl-category-count">'+catChecked+'/'+items.length+'</span></div>';
    html+='<div class="cl-category-progress"><div class="cl-category-progress-fill" style="width:'+catPct+'%"></div></div>';
    items.forEach(function(item){
      html+='<div class="checklist-item'+(item.checked?' checked':'')+'" style="margin-top:8px"><div class="checklist-checkbox'+(item.checked?' checked':'')+'" onclick="toggleChecklistItem(\''+key+'\',\''+idx+'\',\''+item.id+'\')"></div><div class="checklist-item-text">'+escapeHtml(item.text)+'</div><button class="checklist-item-del" onclick="deleteChecklistItem(\''+key+'\',\''+idx+'\',\''+item.id+'\')">✕</button></div>';
    });
    html+='<div class="cl-category-add"><input type="text" id="cl-input-'+idx+'" placeholder="添加'+cat.name+'..." onkeydown="if(event.key===\'Enter\')addChecklistItem(\''+key+'\',\''+idx+'\')"><button onclick="addChecklistItem(\''+key+'\',\''+idx+'\')">+</button></div>';
    html+='</div>';
  });
  container.innerHTML=html;
}

function toggleChecklistItem(key,catIdx,itemId){
  var catName=DEFAULT_CHECKLISTS[key].categories[catIdx].name;
  var items=state.checklists[key][catName]||[];
  var item=items.find(function(i){return i.id===itemId});
  if(item){item.checked=!item.checked;saveState();renderChecklistDetail(key)}
}

function addChecklistItem(key,catIdx){
  var catName=DEFAULT_CHECKLISTS[key].categories[catIdx].name;
  var input=document.getElementById('cl-input-'+catIdx);
  var text=input.value.trim();
  if(!text){showToast('请输入物品名称','error');return}
  if(!state.checklists[key][catName]) state.checklists[key][catName]=[];
  state.checklists[key][catName].push({id:genId('item'),text:text,checked:false});
  saveState();renderChecklistDetail(key);
  setTimeout(function(){var i=document.getElementById('cl-input-'+catIdx);if(i)i.focus()},50);
}

function deleteChecklistItem(key,catIdx,itemId){
  var catName=DEFAULT_CHECKLISTS[key].categories[catIdx].name;
  state.checklists[key][catName]=state.checklists[key][catName].filter(function(i){return i.id!==itemId});
  saveState();renderChecklistDetail(key);
}

// ==================== NOTES ====================
function renderNotes(){
  var now=new Date();
  if(currentView.calYear===0){currentView.calYear=now.getFullYear();currentView.calMonth=now.getMonth()}
  if(!currentView.selectedDate) currentView.selectedDate=todayStr();
  var y=currentView.calYear,m=currentView.calMonth;
  var html='<div class="calendar">';
  html+='<div class="cal-nav"><button class="cal-nav-btn" onclick="calPrev()">←</button><div class="cal-month">'+y+'年'+(m+1)+'月</div><button class="cal-nav-btn" onclick="calNext()">→</button></div>';
  html+='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(function(d){html+='<div class="cal-weekday">'+d+'</div>'});
  var firstDay=new Date(y,m,1).getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  for(var i=0;i<firstDay;i++) html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var ds=y+'-'+p(m+1)+'-'+p(d);
    var hasNotes=state.notes[ds]&&state.notes[ds].length>0;
    var isToday=ds===todayStr();
    var isSelected=ds===currentView.selectedDate;
    html+='<div class="cal-day'+(hasNotes?' has-notes':'')+(isToday?' today':'')+(isSelected?' selected':'')+'" onclick="selectDate(\''+ds+'\')">'+d+'</div>';
  }
  html+='</div></div>';

  // Notes for selected date
  var sel=currentView.selectedDate;
  var notes=state.notes[sel]||[];
  html+='<div class="notes-section"><div class="notes-date-label">📝 '+formatDate(sel)+'</div>';
  if(notes.length===0){
    html+='<div style="text-align:center;padding:16px 0;color:var(--text-muted);font-size:13px">这一天还没有小记 ✨</div>';
  }else{
    notes.forEach(function(n){
      html+='<div class="note-item"><button class="note-item-del" onclick="deleteNote(\''+sel+'\',\''+n.id+'\')">✕</button><div class="note-item-title">'+escapeHtml(n.title)+'</div><div class="note-item-content">'+escapeHtml(n.content)+'</div><div class="note-item-time">'+(n.time||'')+'</div></div>';
    });
  }
  html+='<div class="note-add"><input type="text" id="note-title" placeholder="标题" onkeydown="if(event.key===\'Enter\')document.getElementById(\'note-content\').focus()"><textarea id="note-content" placeholder="写下你的旅行小记..." oninput="autoSave()"></textarea><button onclick="addNote(\''+sel+'\')">添加小记</button></div>';
  html+='</div>';
  document.getElementById('tab-notes').innerHTML=html;
}

function calPrev(){currentView.calMonth--;if(currentView.calMonth<0){currentView.calMonth=11;currentView.calYear--}renderNotes()}
function calNext(){currentView.calMonth++;if(currentView.calMonth>11){currentView.calMonth=0;currentView.calYear++}renderNotes()}
function selectDate(ds){currentView.selectedDate=ds;renderNotes()}

function addNote(dateStr){
  var title=document.getElementById('note-title').value.trim();
  var content=document.getElementById('note-content').value.trim();
  if(!title&&!content){showToast('请输入内容','error');return}
  if(!state.notes[dateStr]) state.notes[dateStr]=[];
  var now=new Date();

// ==================== GITHUB ENCRYPTED SYNC ====================

// --- Encryption using Web Crypto API (AES-GCM + PBKDF2) ---
async function deriveKey(password, salt) {
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:salt, iterations:150000, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}

async function encryptData(plaintext, password) {
  var enc = new TextEncoder();
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var key = await deriveKey(password, salt);
  var encrypted = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, enc.encode(plaintext));
  // Combine salt + iv + ciphertext
  var combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
  combined.set(salt, 0);
  combined.set(iv, salt.length);
  combined.set(new Uint8Array(encrypted), salt.length + iv.length);
  // Base64 encode (chunked to avoid call stack overflow on large data)
  var binary = '';
  var chunkSize = 8192;
  for (var i = 0; i < combined.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, combined.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

async function decryptData(b64Data, password) {
  var combined = new Uint8Array(atob(b64Data).split('').map(function(c){return c.charCodeAt(0)}));
  var salt = combined.slice(0, 16);
  var iv = combined.slice(16, 28);
  var ciphertext = combined.slice(28);
  var key = await deriveKey(password, salt);
  var decrypted = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ciphertext);
  return new TextDecoder().decode(decrypted);
}

// --- GitHub API ---
function ghApi(path, method, body, token) {
  var url = 'https://api.github.com/repos/' + path;
  var opts = {
    method: method || 'GET',
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(function(r) {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub API error: ' + r.status + ' ' + r.statusText);
    return r.json();
  });
}

function getGhSettings() {

async function syncToGitHub() {
  var cfg = getGhSettings();
  if (!cfg.token || !cfg.owner || !cfg.password) {
    showToast('请先在设置中配置 GitHub 信息和加密密码', 'error');
    return;
  }
  updateSyncUI('syncing');
  try {
    // Serialize and encrypt data
    var dataStr = JSON.stringify(state);
    var encrypted = await encryptData(dataStr, cfg.password);
    // encryptData already returns base64, use directly for GitHub API
    var content = encrypted;

    // Check if file exists (get SHA for update)
    var existing = null;
    try {
      existing = await ghApi(cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path + '?ref=' + cfg.branch, 'GET', null, cfg.token);
    } catch(e) { /* file may not exist yet */ }

    var body = {
      message: '🔄 Auto sync: ' + new Date().toISOString(),
      content: content,
      branch: cfg.branch
    };
    if (existing && existing.sha) body.sha = existing.sha;

    await ghApi(cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path, 'PUT', body, cfg.token);

    state.settings.github.connected = true;
    state.settings.github.lastCloudSync = new Date().toISOString();
    state.settings.lastSync = new Date().toISOString();
    saveState(true);
    updateSyncUI('synced');
    showToast('☁️ 数据已同步到 GitHub');
  } catch(err) {
    console.error('Sync error:', err);
    state.settings.github.connected = false;
    updateSyncUI('error');
    showToast('同步失败: ' + err.message, 'error');
  }
}

// Sync (download) data from GitHub
async function syncFromGitHub() {
  var cfg = getGhSettings();
  if (!cfg.token || !cfg.owner || !cfg.password) {
    showToast('请先在设置中配置 GitHub 信息和加密密码', 'error');
    return;
  }
  updateSyncUI('syncing');
  try {
    var file = await ghApi(cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path + '?ref=' + cfg.branch, 'GET', null, cfg.token);
    if (!file) {
      showToast('云端暂无数据，请先上传', 'error');
      updateSyncUI('notsynced');
      return;
    }

    // Decode and decrypt (file.content is base64 from GitHub API = encrypted base64)
    var encrypted = file.content.replace(/\n/g, '');
    var decrypted = await decryptData(encrypted, cfg.password);
    var data = JSON.parse(decrypted);

    confirmDialog('恢复数据', '将从 GitHub 恢复数据，当前本地数据将被覆盖。确定继续吗？', function() {
      state.profile = data.profile || state.profile;
      state.trips = data.trips || [];
      state.checklists = data.checklists || {};
      state.notes = data.notes || {};
      state.footprints = data.footprints || [];
      state.wishlist = data.wishlist || [];
      state.settings.lastSync = data.settings ? data.settings.lastSync : null;
      // Preserve GitHub settings from current state
      state.settings.github = getGhSettings();
      state.settings.github.connected = true;
      state.settings.github.lastCloudSync = new Date().toISOString();
      initDefaultChecklists();
      saveState();
      updateSyncUI('synced');
      applyGlobalBg();
      if (mapInitialized && map) { map.remove(); mapInitialized = false; map = null; }
      switchTab('home');
      showToast('☁️ 数据已从 GitHub 恢复');
    });
    updateSyncUI('synced');
  } catch(err) {
    console.error('Restore error:', err);
    updateSyncUI('error');
    showToast('恢复失败: ' + err.message, 'error');
  }
}

function updateSyncUI(status) {
  var el = document.getElementById('sync-status-bar');
  if (!el) return;
  var cfg = getGhSettings();
  var html = '';
  if (status === 'syncing') {
    html = '<div class="sync-status-bar syncing"><div class="sync-status-icon">🔄</div><div class="sync-status-text"><div class="sync-status-label">正在同步...</div><div class="sync-status-desc">请勿关闭页面</div></div></div>';
  } else if (status === 'synced') {
    var t = state.settings.github.lastCloudSync ? new Date(state.settings.github.lastCloudSync) : null;
    var tStr = t ? (t.getMonth()+1)+'月'+t.getDate()+'日 '+t.getHours()+':'+p(t.getMinutes()) : '刚刚';
    html = '<div class="sync-status-bar synced"><div class="sync-status-icon">✅</div><div class="sync-status-text"><div class="sync-status-label">已同步到 GitHub</div><div class="sync-status-desc">上次同步: '+tStr+'</div></div></div>';
  } else if (status === 'error') {
    html = '<div class="sync-status-bar error"><div class="sync-status-icon">⚠️</div><div class="sync-status-text"><div class="sync-status-label">同步失败</div><div class="sync-status-desc">请检查配置和网络</div></div></div>';
  } else {
    html = '<div class="sync-status-bar notsynced"><div class="sync-status-icon">☁️</div><div class="sync-status-text"><div class="sync-status-label">未同步</div><div class="sync-status-desc">数据仅保存在本地</div></div></div>';
  }
  el.innerHTML = html;
}

function showGitHubSettings() {
  var cfg = getGhSettings();
  var connected = cfg.token && cfg.owner;
  var html = '';

  // Status bar
  html += '<div id="sync-status-bar">';
  if (state.settings.github && state.settings.github.connected && state.settings.github.lastCloudSync) {
    var t = new Date(state.settings.github.lastCloudSync);
    html += '<div class="sync-status-bar synced"><div class="sync-status-icon">✅</div><div class="sync-status-text"><div class="sync-status-label">已连接 GitHub</div><div class="sync-status-desc">上次同步: '+(t.getMonth()+1)+'月'+t.getDate()+'日 '+t.getHours()+':'+p(t.getMinutes())+'</div></div></div>';
  } else if (connected) {
    html += '<div class="sync-status-bar notsynced"><div class="sync-status-icon">☁️</div><div class="sync-status-text"><div class="sync-status-label">已配置，未同步</div><div class="sync-status-desc">点击下方按钮开始同步</div></div></div>';
  } else {
    html += '<div class="sync-status-bar notsynced"><div class="sync-status-icon">☁️</div><div class="sync-status-text"><div class="sync-status-label">未配置</div><div class="sync-status-desc">填写下方信息以启用云同步</div></div></div>';
  }
  html += '</div>';

  // Form
  html += '<div class="github-form-group"><label>GitHub 用户名</label><input type="text" id="gh-owner" placeholder="你的 GitHub 用户名" value="'+escapeHtml(cfg.owner)+'"><div class="hint">你的 GitHub 账号用户名（不是邮箱）</div></div>';

  html += '<div class="github-form-group"><label>Personal Access Token</label><input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" value="'+escapeHtml(cfg.token)+'"><div class="hint">需要 repo 权限。Token 仅存储在本设备，不会上传到任何服务器。<br>👉 生成方式: GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token → 勾选 repo</div></div>';

  html += '<div class="github-form-group"><label>仓库名称</label><input type="text" id="gh-repo" placeholder="literate-palm-tree" value="'+escapeHtml(cfg.repo)+'"><div class="hint">建议创建为 <strong>私有仓库(Private)</strong>，确保数据私密性</div></div>';

  html += '<div class="github-form-group"><label>加密密码</label><input type="password" id="gh-password" placeholder="设置加密密码" value="'+escapeHtml(cfg.password)+'"><div class="hint">数据在上传前会使用此密码进行 AES-256 加密。请牢记密码，丢失密码将无法解密数据！</div></div>';

  html += '<div class="github-form-group"><label>分支名称</label><input type="text" id="gh-branch" placeholder="main" value="'+escapeHtml(cfg.branch)+'"></div>';

  // Auto sync toggle
  html += '<div class="sync-toggle"><div class="sync-toggle-label">🔄 自动同步（每次保存后上传）</div><div class="toggle-switch'+(cfg.autoSync?' on':'')+'" onclick="this.classList.toggle(\'on\')" id="gh-autosync"></div></div>';

  // Info box
  html += '<div class="sync-info-box"><strong>🔒 隐私保护说明</strong><br>• Token 和密码仅存储在本地浏览器，不会发送到第三方<br>• 所有数据在上传前经过 AES-256-GCM 加密<br>• 建议使用私有仓库，即使仓库泄露数据也无法解密<br>• GitHub API 通过 HTTPS 加密传输</div>';

  // Buttons
  html += '<button class="sync-btn sync-btn-primary" onclick="saveGitHubSettings()">💾 保存配置</button>';
  html += '<button class="sync-btn sync-btn-secondary" onclick="syncToGitHub()">☁️ 上传到 GitHub</button>';
  html += '<button class="sync-btn sync-btn-secondary" onclick="syncFromGitHub()">📥 从 GitHub 恢复</button>';

  showModal('🔒 GitHub 加密云同步', html);
}

function saveGitHubSettings() {
  var cfg = {
    token: document.getElementById('gh-token').value.trim(),
    owner: document.getElementById('gh-owner').value.trim(),
    repo: document.getElementById('gh-repo').value.trim() || 'literate-palm-tree',
    branch: document.getElementById('gh-branch').value.trim() || 'main',
    path: 'data/mona-data.enc.json',
    password: document.getElementById('gh-password').value,
    autoSync: document.getElementById('gh-autosync').classList.contains('on'),
    connected: false,
    lastCloudSync: state.settings.github ? state.settings.github.lastCloudSync : null
  };

  if (cfg.token && cfg.owner && cfg.password) {
    cfg.connected = true;
  }

  state.settings.github = cfg;
  saveState();
  showToast('✅ GitHub 配置已保存');
  updateSyncUI(cfg.connected ? 'synced' : 'notsynced');
  renderProfile();
}

// Auto sync hook - called after saveState
function maybeAutoSync() {
  var cfg = getGhSettings();
  if (cfg.autoSync && cfg.token && cfg.owner && cfg.password && navigator.onLine) {
    clearTimeout(window._autoSyncTimer);
    window._autoSyncTimer = setTimeout(function() {
      syncToGitHub();
    }, 5000); // 5 second debounce
  }
}

// ==================== CLOUD UPDATE CHECK ====================

// On app launch, check if cloud has newer data (for multi-device sync)
async function checkCloudUpdate() {
  var cfg = getGhSettings();
  if (!cfg.token || !cfg.owner || !cfg.password) return; // not configured
  if (!navigator.onLine) return; // offline
  
  try {
    // Get latest commit for the data file to check timestamp
    var commits = await ghApi(
      cfg.owner + '/' + cfg.repo + '/commits?path=' + encodeURIComponent(cfg.path) + '&sha=' + cfg.branch + '&per_page=1',
      'GET', null, cfg.token
    );
    if (!commits || !commits.length) return; // no cloud data yet
    
    var cloudDate = new Date(commits[0].commit.committer.date);
    var localSync = state.settings.github.lastCloudSync ? new Date(state.settings.github.lastCloudSync) : null;
    
    // If never synced locally, or cloud is newer (with 10s buffer to avoid false positive from same-device upload)
    var needUpdate = !localSync || (cloudDate.getTime() > localSync.getTime() + 10000);
    
    if (needUpdate) {
      var timeStr = (cloudDate.getMonth()+1) + '\u6708' + cloudDate.getDate() + '\u65e5 ' + cloudDate.getHours() + ':' + p(cloudDate.getMinutes());
      showCloudUpdateBanner(timeStr);
    }
  } catch(e) {
    console.log('[CloudCheck] ' + e.message);
  }
}

function showCloudUpdateBanner(timeStr) {
  dismissCloudBanner(); // remove existing
  var banner = document.createElement('div');
  banner.id = 'cloud-update-banner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#2E7D32,#43A047);color:#fff;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2);transform:translateY(-100%);transition:transform .3s ease';
  banner.innerHTML = '<span style="font-size:20px">\u2601\ufe0f</span>'+
    '<div style="flex:1"><div style="font-weight:600">\u68c0\u6d4b\u5230\u4e91\u7aef\u6709\u66f4\u65b0\u6570\u636e</div>'+
    '<div style="font-size:11px;opacity:.85">\u66f4\u65b0\u65f6\u95f4: '+timeStr+'</div></div>'+
    '<button onclick="restoreFromCloudAuto()" style="background:rgba(255,255,255,.25);border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">\u6062\u590d</button>'+
    '<button onclick="dismissCloudBanner()" style="background:transparent;border:none;color:#fff;padding:6px 8px;font-size:16px;cursor:pointer">\u2715</button>';
  document.body.appendChild(banner);
  // Slide down animation
  requestAnimationFrame(function() { banner.style.transform = 'translateY(0)'; });
  // Auto dismiss after 15 seconds
  window._cloudBannerTimer = setTimeout(dismissCloudBanner, 15000);
}

function dismissCloudBanner() {
  var b = document.getElementById('cloud-update-banner');
  if (b) {
    b.style.transform = 'translateY(-100%)';
    setTimeout(function() { if (b && b.parentNode) b.parentNode.removeChild(b); }, 300);
  }
  if (window._cloudBannerTimer) { clearTimeout(window._cloudBannerTimer); window._cloudBannerTimer = null; }
}

async function restoreFromCloudAuto() {
  dismissCloudBanner();
  await syncFromGitHub();
}

// ==================== INIT ====================
function applyGlobalBg(){
  var el=document.getElementById('app-global-bg');
  if(!el)return;
  var bg=state.profile.bgImage;
  if(!bg){
    var preset=PROFILE_BGS.find(function(b){return b.id===state.profile.bgPreset})||PROFILE_BGS[0];
    bg=preset.css;
  }
  el.style.background=bg;
  el.style.backgroundSize='cover';
  el.style.backgroundPosition='center';
  var opacity=state.profile.bgOpacity!=null?state.profile.bgOpacity:0.85;
  el.style.opacity=opacity;
}

function applyTheme(){
  var theme=THEME_PRESETS.find(function(t){return t.id===state.profile.themeColor})||THEME_PRESETS[0];
  var root=document.documentElement;
  root.style.setProperty('--primary',theme.primary);
  root.style.setProperty('--primary-mid',theme.primaryMid);
  root.style.setProperty('--primary-light',theme.primaryLight);
  root.style.setProperty('--primary-lighter',theme.primaryLighter);
  root.style.setProperty('--primary-lightest',theme.primaryLightest);
  root.style.setProperty('--bg',theme.bg);
  root.style.setProperty('--text',theme.text);
  root.style.setProperty('--border',theme.border);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',theme.primary);
}

function init(){
  loadState();
  applyTheme();
  applyGlobalBg();
  switchTab('home');
  window.addEventListener('online',function(){updateSyncStatus('online');showToast('🟢 网络已连接')});
  window.addEventListener('offline',function(){updateSyncStatus('offline');showToast('🟠 网络已断开')});
  // Update countdown daily
  setInterval(function(){if(currentView.tab==='home')renderHome()},60000);
  // Register service worker for PWA
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      console.log('[SW] Registered successfully');
    }).catch(function(err){
      console.log('[SW] Registration failed:', err);
    });
  }
  // Check cloud for updates (multi-device sync) - delayed 2s after load
  setTimeout(checkCloudUpdate, 2000);
  // Hide loader
  setTimeout(function(){document.getElementById('loader').classList.add('hide');setTimeout(function(){var l=document.getElementById('loader');if(l)l.style.display='none'},600)},800);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
